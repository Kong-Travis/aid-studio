# Local macOS stack: serves the Vietnamese web and admin builds and proxies API calls to the
# backend running on the host (port 8080). Mirrors deploy/nginx/public.conf.template and
# deploy/nginx/admin.conf.template without TLS. Mounted by vi/local/run-frontend.sh.

client_max_body_size 512m;
proxy_connect_timeout 30s;
proxy_read_timeout 600s;

# Web app: http://localhost:3000
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/aid/web;
    index index.html;

    location /aid/ {
        proxy_pass http://host.docker.internal:8080/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location /profile/ {
        proxy_pass http://host.docker.internal:8080/profile/;
        proxy_set_header Host $proxy_host;
    }
    location /_next/ {
        try_files $uri =404;
    }
    location ~ ^/user/([1-9][0-9]*)/?$ { return 302 /user/?id=$1; }
    location / {
        try_files $uri $uri/ $uri.html /200.html;
    }
}

# Media-only origin for the public tunnel (vi/local/run-tunnel.sh): http://localhost:8099
# Model providers fetch reference images by URL, so uploaded files must be reachable from the
# internet. This server exposes /profile/ (uploaded media) and nothing else.
server {
    listen 8099;
    server_name _;
    location /profile/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://host.docker.internal:8080/profile/;
        proxy_set_header Host $proxy_host;
    }
    location / { return 404; }
}

# Admin console: http://localhost:8090
server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/aid/admin;
    index index.html;

    location /prod-api/ {
        proxy_pass http://host.docker.internal:8080/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location /profile/ {
        proxy_pass http://host.docker.internal:8080/profile/;
        proxy_set_header Host $proxy_host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
